<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F766E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="32" />

  <!-- Abstract decorative shapes -->
  <circle cx="80" cy="80" r="40" fill="#5EEAD4" opacity="0.35" />
  <circle cx="340" cy="320" r="60" fill="#14B8A6" opacity="0.15" />
  <circle cx="330" cy="100" r="24" fill="#0EA5E9" opacity="0.2" />

  <!-- Calendar card -->
  <g filter="url(#shadow)">
    <rect x="75" y="100" width="250" height="210" rx="24" fill="#FFFFFF" />
    <path d="M 75 124 C 75 110.745 85.745 100 99 100 L 301 100 C 314.255 100 325 110.745 325 124 L 325 145 L 75 145 Z" fill="url(#primaryGrad)" />
    
    <!-- Calendar rings -->
    <rect x="120" y="85" width="14" height="28" rx="7" fill="#0F766E" />
    <rect x="266" y="85" width="14" height="28" rx="7" fill="#0F766E" />
    
    <!-- Calendar header text placeholder -->
    <circle cx="105" cy="122" r="5" fill="#FFFFFF" opacity="0.8" />
    <rect x="120" y="118" width="50" height="8" rx="4" fill="#FFFFFF" opacity="0.9" />

    <!-- Calendar grid items -->
    <rect x="100" y="165" width="36" height="30" rx="8" fill="#F1F5F9" />
    <rect x="150" y="165" width="36" height="30" rx="8" fill="#F1F5F9" />
    <rect x="200" y="165" width="36" height="30" rx="8" fill="url(#primaryGrad)" />
    <rect x="250" y="165" width="36" height="30" rx="8" fill="#F1F5F9" />

    <rect x="100" y="210" width="36" height="30" rx="8" fill="#F1F5F9" />
    <rect x="150" y="210" width="36" height="30" rx="8" fill="#F1F5F9" />
    <rect x="200" y="210" width="36" height="30" rx="8" fill="#F1F5F9" />
    <rect x="250" y="210" width="36" height="30" rx="8" fill="#F1F5F9" />

    <rect x="100" y="255" width="36" height="30" rx="8" fill="#F1F5F9" />
    <rect x="150" y="255" width="36" height="30" rx="8" fill="#F1F5F9" />
    <rect x="200" y="255" width="36" height="30" rx="8" fill="#F1F5F9" />
    <rect x="250" y="255" width="36" height="30" rx="8" fill="#F1F5F9" />

    <!-- Checkmark on selected date -->
    <path d="M 213 180 L 217 184 L 225 174" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Floating badge -->
  <g filter="url(#shadow)">
    <rect x="230" y="240" width="120" height="52" rx="16" fill="#FFFFFF" />
    <circle cx="254" cy="266" r="14" fill="#ECFDF5" />
    <path d="M 248 266 L 252 270 L 260 262" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="276" y="258" width="56" height="7" rx="3.5" fill="#0F172A" />
    <rect x="276" y="270" width="38" height="5" rx="2.5" fill="#94A3B8" />
  </g>
</svg>
