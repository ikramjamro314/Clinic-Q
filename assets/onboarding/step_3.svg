<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <linearGradient id="primaryGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F766E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="400" fill="url(#bgGrad3)" rx="32" />

  <!-- Abstract decorative shapes -->
  <circle cx="310" cy="300" r="55" fill="#5EEAD4" opacity="0.3" />
  <circle cx="80" cy="110" r="30" fill="#0EA5E9" opacity="0.2" />

  <!-- Mobile phone frame -->
  <g filter="url(#shadow3)">
    <rect x="110" y="70" width="180" height="260" rx="28" fill="#FFFFFF" />
    <rect x="118" y="78" width="164" height="244" rx="22" fill="#F8FAFC" />

    <!-- Speaker notch -->
    <rect x="175" y="86" width="50" height="4" rx="2" fill="#CBD5E1" />

    <!-- Quick Action Card 1 -->
    <rect x="132" y="105" width="136" height="52" rx="14" fill="#FFFFFF" />
    <circle cx="154" cy="131" r="14" fill="#EFF6FF" />
    <path d="M 154 123 L 154 139 M 146 131 L 162 131" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />
    <rect x="176" y="124" width="60" height="6" rx="3" fill="#0F172A" />
    <rect x="176" y="134" width="40" height="4" rx="2" fill="#94A3B8" />

    <!-- Quick Action Card 2 (Active/Highlighted) -->
    <rect x="132" y="168" width="136" height="52" rx="14" fill="url(#primaryGrad3)" />
    <circle cx="154" cy="194" r="14" fill="#FFFFFF" opacity="0.25" />
    <circle cx="154" cy="194" r="7" fill="#FFFFFF" />
    <rect x="176" y="187" width="65" height="6" rx="3" fill="#FFFFFF" />
    <rect x="176" y="197" width="45" height="4" rx="2" fill="#CCFBF1" />

    <!-- Quick Action Card 3 -->
    <rect x="132" y="231" width="136" height="52" rx="14" fill="#FFFFFF" />
    <circle cx="154" cy="257" r="14" fill="#ECFDF5" />
    <path d="M 148 257 L 152 261 L 160 253" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="176" y="250" width="55" height="6" rx="3" fill="#0F172A" />
    <rect x="176" y="260" width="35" height="4" rx="2" fill="#94A3B8" />
  </g>

  <!-- Floating lightning/instant icon -->
  <g filter="url(#shadow3)">
    <circle cx="280" cy="130" r="26" fill="#0D9488" />
    <path d="M 282 118 L 273 131 L 280 131 L 278 142 L 287 129 L 280 129 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
  </g>
</svg>
