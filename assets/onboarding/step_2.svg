<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <linearGradient id="primaryGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F766E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="400" fill="url(#bgGrad2)" rx="32" />

  <!-- Abstract decorative shapes -->
  <circle cx="90" cy="320" r="50" fill="#5EEAD4" opacity="0.3" />
  <circle cx="320" cy="80" r="35" fill="#0EA5E9" opacity="0.2" />

  <!-- Shield & Record Card -->
  <g filter="url(#shadow2)">
    <rect x="80" y="90" width="240" height="220" rx="24" fill="#FFFFFF" />

    <!-- Medical Record Header -->
    <rect x="110" y="120" width="100" height="10" rx="5" fill="#0F172A" />
    <rect x="110" y="138" width="140" height="6" rx="3" fill="#94A3B8" />
    <rect x="110" y="152" width="120" height="6" rx="3" fill="#CBD5E1" />

    <line x1="110" y1="175" x2="290" y2="175" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Record lines -->
    <rect x="110" y="195" width="80" height="8" rx="4" fill="#64748B" />
    <rect x="110" y="212" width="130" height="6" rx="3" fill="#CBD5E1" />
    <rect x="110" y="226" width="110" height="6" rx="3" fill="#CBD5E1" />

    <!-- Verified Badge Icon -->
    <circle cx="260" cy="130" r="16" fill="#ECFDF5" />
    <path d="M 254 130 L 258 134 L 266 126" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Large Security Shield in Foreground -->
  <g filter="url(#shadow2)">
    <circle cx="260" cy="245" r="48" fill="url(#primaryGrad2)" />
    <!-- Shield Outline -->
    <path d="M 260 215 C 275 215 284 220 284 235 C 284 256 268 270 260 275 C 252 270 236 256 236 235 C 236 220 245 215 260 215 Z" fill="#FFFFFF" opacity="0.25" />
    <!-- Lock inside shield -->
    <rect x="251" y="240" width="18" height="15" rx="3" fill="#FFFFFF" />
    <path d="M 255 240 L 255 235 C 255 232.2 257.2 230 260 230 C 262.8 230 265 232.2 265 235 L 265 240" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="260" cy="247" r="1.5" fill="#0D9488" />
  </g>
</svg>
